version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: squadmap-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: squadmap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: squadmap-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squadmap-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CORS_ORIGIN: "http://localhost:3001"
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/squadmap"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
