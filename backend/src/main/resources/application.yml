spring:
  application:
    name: squadmap
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # A request with a field the API does not know is rejected, not silently accepted.
      fail-on-unknown-properties: true

server:
  # The client address comes from X-Forwarded-For only when the request arrives from a trusted proxy on
  # this machine or a private network (Tomcat's default list below). From anywhere else the header is
  # ignored, so a fake one can't dodge the per-IP rate limits. Behind a chain, the right-most address that
  # isn't a trusted proxy wins, so a value a client sent ahead of the proxy's own is ignored too.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    # Logs every refused live-connection frame (a stranger subscribing, an expired token) as an ERROR.
    # Those are routine; StompAuthInterceptor logs real faults itself.
    org.springframework.web.socket.messaging.StompSubProtocolHandler: off

springdoc:
  swagger-ui:
    path: /swagger-ui.html
