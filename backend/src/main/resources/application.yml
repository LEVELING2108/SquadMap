server:
  port: 8080

spring:
  application:
    name: squadmap-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:squadmapdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

squadmap:
  session:
    expiry-hours: 12
    code-length: 6
  routing:
    osrm-url: "https://router.project-osrm.org"
    eta-refresh-interval-ms: 30000
    arrival-threshold-meters: 100
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://localhost:5173"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:3001"
      - "*"
