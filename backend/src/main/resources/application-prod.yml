# Every value comes from the environment. See backend/.env.example for the full list.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      # Refuse to send credentials or links over an unencrypted connection.
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

squadmap:
  auth:
    jwt-secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}
  web:
    base-url: ${WEB_BASE_URL}
  mapbox:
    token: ${MAPBOX_SERVER_TOKEN}
  push:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT}

# The interactive API docs are a development aid and stay off in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# One JSON object per line (Elastic Common Schema), so a log tool can search and count them. The same
# rule holds as everywhere: no places, tokens, passwords or codes in any message.
logging:
  structured:
    format:
      console: ecs

# Health and metrics on their own port, which only the server's own network reaches: Nginx never forwards
# it, so the public site shows neither. Prometheus scrapes http://app:8481/actuator/prometheus.
management:
  server:
    port: ${MANAGEMENT_PORT:8481}
