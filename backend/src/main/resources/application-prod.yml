# Every value comes from the environment. See backend/.env.example for the full list.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      # Refuse to send credentials or links over an unencrypted connection.
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

squadmap:
  auth:
    jwt-secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}
    web-base-url: ${WEB_BASE_URL}

# The interactive API docs are a development aid and stay off in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
