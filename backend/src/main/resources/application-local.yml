# Developer machine only. These values match infra/docker-compose.dev.yml and are not secrets.
server:
  port: 8480

spring:
  datasource:
    url: jdbc:postgresql://localhost:54320/squadmap
    username: squadmap
    password: squadmap
  data:
    redis:
      host: localhost
      port: 63790
  # Mailpit catches every email. Read them at http://localhost:8425
  mail:
    host: localhost
    port: 10425

# No signing key is set here on purpose: a temporary one is generated at startup.
squadmap:
  auth:
    # Local development runs over plain HTTP, where some browsers drop Secure cookies.
    refresh-cookie-secure: false
  cors:
    allowed-origins:
      - http://localhost:5480
