# Developer machine only. These values match infra/docker-compose.dev.yml and are not secrets.
# Personal keys (such as the Mapbox token) go in backend/.env.local, which git ignores. It is optional:
# without it, everything works except place search.
server:
  port: 8480

spring:
  config:
    import: optional:file:.env.local[.properties]
  datasource:
    url: jdbc:postgresql://localhost:54320/squadmap
    username: squadmap
    password: squadmap
  data:
    redis:
      host: localhost
      port: 63790
  # Mailpit catches every email. Read them at http://localhost:8425
  mail:
    host: localhost
    port: 10425

# No signing key is set here on purpose: a temporary one is generated at startup.
squadmap:
  auth:
    # Local development runs over plain HTTP, where some browsers drop Secure cookies.
    refresh-cookie-secure: false
  cors:
    allowed-origins:
      - http://localhost:5480
  mapbox:
    token: ${MAPBOX_SERVER_TOKEN:}
  # Optional, in .env.local: without them a temporary pair is made at each start.
  push:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
