# Developer machine only. These values match infra/docker-compose.dev.yml and are not secrets.
server:
  port: 8480

spring:
  datasource:
    url: jdbc:postgresql://localhost:54320/squadmap
    username: squadmap
    password: squadmap
  data:
    redis:
      host: localhost
      port: 63790

# No signing key is set here on purpose: a temporary one is generated at startup.
squadmap:
  cors:
    allowed-origins:
      - http://localhost:5480
