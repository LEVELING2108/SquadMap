# Local development services. The credentials here are for this machine only and are not secrets;
# they match backend/src/main/resources/application-local.yml.
# Ports are unusual on purpose, and bound to localhost so nothing is reachable from the network.
name: squadmap-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: squadmap
      POSTGRES_USER: squadmap
      POSTGRES_PASSWORD: squadmap
    ports:
      - '127.0.0.1:54320:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U squadmap -d squadmap']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:63790:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # Catches every email the app sends locally. Inbox: http://localhost:8425
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '127.0.0.1:8425:8025'
      - '127.0.0.1:10425:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
