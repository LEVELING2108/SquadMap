# Security headers for the web app, for the production Nginx server block (Phase 9):
#   include /etc/nginx/snippets/squadmap-security-headers.conf;
# The API sets its own, stricter headers. `npm run e2e:csp` (frontend) loads the built app under this exact
# policy and fails on any blocked request, so keep the policy on one line between the quotes.
#
# Why each source is allowed:
#   api.mapbox.com, *.tiles.mapbox.com  map styles, tiles, sprites, fonts and the static map pictures
#   events.mapbox.com                   Mapbox's usage counting, required by its terms
#   blob:                               Mapbox draws in web workers it creates from blob: URLs
#   data:                               small images and font files the build packs into the page
# Everything else, including the app's own fonts, comes from the site itself.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://api.mapbox.com https://*.tiles.mapbox.com; font-src 'self' data:; connect-src 'self' https://api.mapbox.com https://*.tiles.mapbox.com https://events.mapbox.com; worker-src 'self' blob:; child-src blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Location is the app's whole purpose; everything else stays off.
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Six months to start (docs/07); raise to a year once HTTPS has run without trouble.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
